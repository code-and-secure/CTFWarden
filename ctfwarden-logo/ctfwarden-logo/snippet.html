<!-- 2) on the login card, replace the current shield icon with this: -->
<div class="logo">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="56" height="56" role="img" aria-label="CTFWarden">
  <defs>
    <linearGradient id="cm-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73a5ff"/>
      <stop offset="1" stop-color="#a28dfa"/>
    </linearGradient>
    <linearGradient id="cm-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73a5ff"/>
      <stop offset="1" stop-color="#b9a6ff"/>
    </linearGradient>
  </defs>
  <rect width="56" height="56" rx="30" fill="url(#cm-tile)"/>
  <path d="M64 22 L97 34 V61 C97 83 83 98 64 106 C45 98 31 83 31 61 V34 Z" fill="#0b0f18"/>
  <polyline points="40,66 51,66 56,54 63,82 70,44 76,66 84,66" fill="none" stroke="url(#cm-pulse)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="88" cy="66" r="4.5" fill="#35d29a"/>
</svg>
</div>

<!-- optional glow to match the button -->
<style>
  .logo svg { display:block; margin:0 auto; filter: drop-shadow(0 6px 22px rgba(130,150,255,.45)); }
</style>

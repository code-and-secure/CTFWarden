<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ctfmon · sign in</title>
<style>
:root{
  --bg:#070a10;--panel:rgba(20,24,34,.78);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#e6eaf2;--muted:#8891a4;--accent:#6ea8ff;--accent2:#a78bfa;--high:#ff5c7a;--ok:#34d399;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root:not([data-theme="light"]){color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;background:
  radial-gradient(900px 600px at 15% 10%,rgba(110,168,255,.18),transparent 60%),
  radial-gradient(800px 560px at 90% 90%,rgba(167,139,250,.14),transparent 60%),
  var(--bg);
  color:var(--text);font:14px/1.5 var(--ui);display:flex;align-items:center;justify-content:center;padding:clamp(16px,4vw,32px);overflow:hidden;position:relative}
/* drifting glow + faint grid for depth */
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.orb.a{width:340px;height:340px;background:var(--accent);top:-80px;left:-60px}
.orb.b{width:300px;height:300px;background:var(--accent2);bottom:-90px;right:-40px;animation-delay:-6s}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,30px)}}

.card{position:relative;width:min(392px,100%);background:var(--panel);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--line2);border-radius:20px;padding:clamp(24px,5vw,36px) clamp(20px,5vw,32px);box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);
  animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.card::before{content:"";position:absolute;inset:-1px;border-radius:20px;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(110,168,255,.55),transparent 40%,transparent 60%,rgba(167,139,250,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin-bottom:26px}
.logo{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 14px 34px -10px rgba(110,168,255,.7)}
.logo svg{width:28px;height:28px;color:#0b0f18}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em}
.sub{margin:0;color:var(--muted);font-size:13px}

form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.control{position:relative;display:flex;align-items:center}
.control>svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none;transition:color .15s}
.control input{width:100%;background:rgba(7,10,16,.7);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px 12px 40px;font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s,background .15s}
.control input::placeholder{color:#55606f}
.control input:hover{border-color:var(--line2)}
.control input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(110,168,255,.16);background:rgba(7,10,16,.9)}
.control:focus-within>svg{color:var(--accent)}
.toggle{position:absolute;right:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;display:grid;place-items:center}
.toggle:hover{color:var(--text);background:rgba(255,255,255,.05)}
.toggle:focus-visible,button[type=submit]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle svg{width:18px;height:18px}

#err{min-height:20px;margin:-4px 0 -6px;color:var(--high);font-size:13px;display:flex;align-items:center;gap:8px}
#err:empty::before{content:""}
#err.shake{animation:shake .36s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

button[type=submit]{position:relative;width:100%;border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:600;font-size:15px;color:#0b0f18;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 30px -10px rgba(110,168,255,.7);transition:transform .08s,filter .15s,box-shadow .15s}
button[type=submit]:hover{filter:brightness(1.07);box-shadow:0 16px 36px -10px rgba(110,168,255,.8)}
button[type=submit]:active{transform:translateY(1px)}
button[type=submit]:disabled{cursor:progress;filter:saturate(.6) brightness(.95)}
.spin{display:none;width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(11,15,24,.25);border-top-color:#0b0f18;margin:0 auto;vertical-align:middle;animation:spin .7s linear infinite}
button[type=submit].busy .label{visibility:hidden}
button[type=submit].busy .spin{display:block;position:absolute;inset:0;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}

.foot{margin:22px 0 0;text-align:center;color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;gap:7px}
.foot i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

@media (max-width:420px){ .card{border-radius:18px} }
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>

<main class="card">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <div>
      <h1>ctfmon</h1>
      <p class="sub">Sign in to the monitor</p>
    </div>
  </div>

  <form id="login" autocomplete="on" novalidate>
    <div class="field">
      <label for="username">Username</label>
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        <input id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="admin" required autofocus>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        <button type="button" class="toggle" id="peek" aria-label="show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <p id="err" role="alert"></p>

    <button type="submit" id="submit"><span class="label">Sign in</span><span class="spin" aria-hidden="true"></span></button>
  </form>

  <p class="foot"><i aria-hidden="true"></i>Secured session · logins are rate-limited</p>
</main>

<script src="/login.js"></script>
</body>
</html>
